  <title>RENAULT FAST</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
    header { background: #000; color: #fff; padding: 20px; text-align: center; font-size: 2em; position: sticky; top: 0; z-index: 10; }
    .search-bar { text-align: center; margin: 10px; }
    .search-bar input { padding: 8px; width: 80%; max-width: 400px; font-size: 1em; }
    .product-list { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; }
    .product { background: white; border: 1px solid #ccc; border-radius: 10px; width: 300px; margin: 10px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .product img { width: 100%; border-radius: 10px; }
    .product h3 { font-size: 1em; margin: 10px 0 5px; }
    .product p { font-size: 0.9em; color: #333; }
    .price { font-weight: bold; color: green; }
    .add-btn { margin-top: 10px; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
    .whatsapp-btn, .top-btn {
      position: fixed; bottom: 20px; padding: 15px; border: none; border-radius: 10px;
      font-size: 14px; cursor: pointer; z-index: 100;
    }
    .whatsapp-btn { right: 20px; background: #25D366; color: white; }
    .top-btn { left: 20px; background: #333; color: white; }
  </style>
</head>

    const cart = [];
    const container = document.getElementById('products');

    function renderProducts() {
      container.innerHTML = "";
      products.forEach((p, index) => {
        const div = document.createElement('div');
        div.className = 'product';
        div.innerHTML = `
          <img src="${p.img}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p class="price">$${p.price.toFixed(2)}</p>
          <button class="add-btn" onclick="addToCart(${index})">Agregar al carrito</button>
        `;
        container.appendChild(div);
      });
    }

    function addToCart(index) {
      cart.push(products[index]);
      alert(`${products[index].name} agregado al carrito.`);
    }

    function sendWhatsApp() {
      if(cart.length === 0) return alert("Tu carrito está vacío.");
      let total = 0;
      let text = "Hola, quiero comprar los siguientes repuestos:%0A";
      cart.forEach(p => {
        text += `- ${p.name} ($${p.price.toFixed(2)})%0A`;
        total += p.price;
      });
      text += `%0ATotal: $${total.toFixed(2)}`;
      const phone = "593987292577";
      window.open(`https://wa.me/${phone}?text=${text}`);
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const items = document.querySelectorAll('.product');
      products.forEach((p, i) => {
        items[i].style.display = p.name.toLowerCase().includes(query) ? 'block' : 'none';
      });
    }

    renderProducts();
